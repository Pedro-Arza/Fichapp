<div class="login-page">
  <div class="login-card">

    <!-- Logo -->
    <div class="logo-area">
      <div class="logo-cross">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="12" y="2" width="8" height="28" rx="2" fill="white"/>
          <rect x="2" y="12" width="28" height="8" rx="2" fill="white"/>
        </svg>
      </div>
      <h1 class="logo-name">Medi<span>Track</span></h1>
      <p class="logo-hospital">Hospital Universitario</p>
      <p class="logo-sub">Sistema de Control de Presencia Médica</p>
    </div>

    <form class="login-form" (ngSubmit)="onSubmit()" #loginForm="ngForm">

      @if (error()) {
        <div class="alert-error">
          <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M12 8v4M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          {{ error() }}
        </div>
      }

      <div class="field-group">
        <label for="email">Correo institucional</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" stroke="currentColor" stroke-width="1.8"/><polyline points="22,6 12,13 2,6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input
            id="email" type="email"
            [(ngModel)]="email" name="email"
            placeholder="medico@hospital.es"
            autocomplete="email"
            [disabled]="loading()"
          />
        </div>
      </div>

      <div class="field-group">
        <label for="password">Contraseña</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input
            id="password" type="password"
            [(ngModel)]="password" name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            [disabled]="loading()"
          />
        </div>
      </div>

      <button class="btn-login" type="submit" [disabled]="loading()">
        @if (loading()) {
          <span class="btn-spinner"></span> Verificando credenciales...
        } @else {
          <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polyline points="10 17 15 12 10 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="15" y1="12" x2="3" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Acceder al Sistema
        }
      </button>
    </form>

    <p class="login-footer">
      Acceso restringido a personal autorizado del Hospital Universitario.<br/>
      Para soporte: <strong>tic&#64;hospital.es</strong>
    </p>
  </div>
</div>
